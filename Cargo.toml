[package]
name = "particles"
version = "0.1.2"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "Standard Model explorer: the fundamental particles, and a zoom from an atom down through nucleus and nucleon to the quarks. Part of the Fe2O3 suite, built on crust."
license = "Unlicense"
repository = "https://github.com/isene/particles"

[dependencies]
crust = { version = "0.1", path = "../crust", package = "fe2o3-crust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["tls", "json"] }

[profile.release]
opt-level = 3
lto = true
strip = true
