<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#141420"/>
      <stop offset="100%" style="stop-color:#08080e"/>
    </linearGradient>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f74c00"/>
      <stop offset="100%" style="stop-color:#b7410e"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" style="stop-color:#ffc85a" stop-opacity="0.55"/>
      <stop offset="100%" style="stop-color:#ffc85a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes pulse { 0%,100% { opacity: 0.9; } 50% { opacity: 0.35; } }
    @keyframes spin  { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .flux { animation: pulse 2.6s ease-in-out infinite; }
    .sea  { animation: pulse 3.8s ease-in-out 0.7s infinite; }
    .orb  { transform-origin: 128px 128px; animation: spin 14s linear infinite; }
  </style>
  <circle cx="128" cy="128" r="120" fill="url(#bg)" stroke="url(#rust)" stroke-width="3"/>

  <!-- electron shell, tilted -->
  <g class="orb">
    <ellipse cx="128" cy="128" rx="98" ry="36" fill="none" stroke="#4a5f8a" stroke-width="1.6"
             transform="rotate(-24 128 128)"/>
    <circle cx="215" cy="90" r="5" fill="#78dcff"/>
    <circle cx="41" cy="166" r="5" fill="#78dcff"/>
  </g>

  <!-- the proton, blown up: three valence quarks in a gluon haze -->
  <circle cx="128" cy="128" r="58" fill="url(#glow)"/>
  <g class="sea" fill="#7a6a3a">
    <circle cx="104" cy="104" r="2"/><circle cx="152" cy="112" r="2"/>
    <circle cx="112" cy="150" r="2"/><circle cx="146" cy="152" r="2"/>
    <circle cx="128" cy="96"  r="2"/><circle cx="96"  cy="132" r="2"/>
    <circle cx="160" cy="136" r="2"/><circle cx="130" cy="164" r="2"/>
  </g>

  <!-- gluon flux tubes -->
  <g class="flux" stroke="#ffc85a" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M128 86 L94 158"/>
    <path d="M94 158 L162 158"/>
    <path d="M162 158 L128 86"/>
  </g>

  <!-- valence quarks: red, green, blue -->
  <circle cx="128" cy="86"  r="13" fill="#ff5a5a"/>
  <circle cx="94"  cy="158" r="13" fill="#6ee682"/>
  <circle cx="162" cy="158" r="13" fill="#6ea0ff"/>
</svg>
